name: build and Push docker image to dockerhub
on:
  push:
    branches:
      - dev


jobs:
  push-code:
    runs-on: cicd-hyperv
    steps:
    - name: actions/checkout step
      uses: actions/checkout@v4
    - name: actions/seup python step
      uses: actions/setup-python@v5
      with:
        python-version: '3.13' 
    - name: install dependencies
      run: |
      python -m pip install --upgrade pip
      pip install -r r.txt
    - name:
      run: |
      python test.py



